name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package skills
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for skill in skills/*/; do
            name=$(basename "$skill")
            tar -czf "dist/${name}-${TAG}.tar.gz" -C skills "$name"
            (cd skills && zip -qr "../dist/${name}-${TAG}.zip" "$name")
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist
      - name: Attest skill archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*
