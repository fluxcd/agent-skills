# Broken scenarios for the gitops-cluster-debug evals.
# Apply on a cluster running Flux Operator and Flux 2.10 (e.g. a kind cluster):
#   kubectl apply -f tests/gitops-cluster-debug/scenarios.yaml
# Eval 2: Kustomization tenant-a/apps blocked by a GitRepository auth failure.
# Eval 3: HelmRelease default/podinfo with a non-existent image tag (ImagePullBackOff).
# Eval 4: Deployment shop/orders generated by a ResourceSet, crashlooping on a missing DB_PASSWORD.
# Eval 5: Kustomization web/podinfo, healthy; the local change is in tests/gitops-cluster-debug/podinfo-change.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
---
apiVersion: v1
kind: Secret
metadata:
  name: git-auth
  namespace: tenant-a
stringData:
  username: tenant-a-bot
  password: ghp_expiredtoken0000000000000000000000
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: tenant-a
  namespace: tenant-a
spec:
  interval: 1m
  url: https://github.com/acme-corp-private/tenant-a-apps.git
  ref:
    branch: main
  secretRef:
    name: git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: tenant-a
spec:
  interval: 10m
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: tenant-a
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: podinfo
  namespace: default
spec:
  interval: 10m
  url: oci://ghcr.io/stefanprodan/charts/podinfo
  ref:
    semver: "6.x"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: default
spec:
  interval: 10m
  timeout: 90s
  chartRef:
    kind: OCIRepository
    name: podinfo
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  values:
    replicaCount: 2
    image:
      tag: 6.99.0-hotfix
---
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: shop-services
  namespace: shop
spec:
  inputs:
    - name: orders
      port: "8080"
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: << inputs.name >>-config
        namespace: shop
      data:
        DB_HOST: postgres.shop.svc.cluster.local
        DB_PORT: "5432"
        DB_NAME: << inputs.name >>
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: << inputs.name >>
        namespace: shop
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: << inputs.name >>
        template:
          metadata:
            labels:
              app: << inputs.name >>
          spec:
            containers:
              - name: app
                image: busybox:1.37
                envFrom:
                  - configMapRef:
                      name: << inputs.name >>-config
                command: ["sh", "-c"]
                args:
                  - |
                    echo "level=info msg=\"starting << inputs.name >> service\" port=<< inputs.port >>"
                    echo "level=info msg=\"loading config\" db_host=$DB_HOST db_port=$DB_PORT"
                    if [ -z "$DB_PASSWORD" ]; then
                      echo "level=error msg=\"database connection failed\" error=\"pq: password authentication failed for user orders: DB_PASSWORD is not set\""
                      echo "level=fatal msg=\"cannot start without database\""
                      exit 1
                    fi
                    sleep 3600
---
apiVersion: v1
kind: Namespace
metadata:
  name: web
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: podinfo
  namespace: web
spec:
  interval: 10m
  url: https://github.com/stefanprodan/podinfo.git
  ref:
    tag: "6.16.0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: web
spec:
  interval: 10m
  path: ./kustomize
  prune: true
  targetNamespace: web
  sourceRef:
    kind: GitRepository
    name: podinfo
  wait: true
